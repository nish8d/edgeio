[project]
name = "edgehealth"
version = "0.1.0"
description = "Health agent for edge devices: reads the host, publishes device.health to Kafka over Tailscale"
requires-python = ">=3.12"
dependencies = ["edgeio-contracts", "edgeio-agent"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["contracts", "agent"]

[tool.uv.sources]
edgeio-contracts = { workspace = true }
edgeio-agent = { workspace = true }
