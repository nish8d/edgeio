[project]
name = "edgeio"
version = "0.1.0"
description = "Simulated edge device health monitoring platform"
requires-python = ">=3.12"
dependencies = ["edgeio-contracts", "edgeio-simulator"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "mypy>=1.12",
    "jsonschema>=4.23",
    "testcontainers[kafka,postgres]>=4.8",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["contracts", "simulator"]

[tool.uv.sources]
edgeio-contracts = { workspace = true }
edgeio-simulator = { workspace = true }

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["contracts/tests", "simulator/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["edgeio_contracts", "edgeio_simulator", "edgeio_worker"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["confluent_kafka.*", "testcontainers.*"]
ignore_missing_imports = true
