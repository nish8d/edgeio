[project]
name = "edgeio"
version = "0.1.0"
description = "Simulated edge device health monitoring platform"
requires-python = ">=3.12"
dependencies = ["edgeio-contracts", "edgeio-simulator", "edgeio-worker", "edgeio-api", "edgeio-agent"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "mypy>=1.12",
    "jsonschema>=4.23",
    "testcontainers[kafka,postgres]>=4.8",
    "httpx2>=2.13",
    "types-psutil>=5.9",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["contracts", "simulator", "worker", "api", "agent"]

[tool.uv.sources]
edgeio-contracts = { workspace = true }
edgeio-simulator = { workspace = true }
edgeio-worker = { workspace = true }
edgeio-api = { workspace = true }
edgeio-agent = { workspace = true }

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["contracts/tests", "simulator/tests", "worker/tests", "api/tests", "agent/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["edgeio_contracts", "edgeio_simulator", "edgeio_worker", "edgeio_api", "edgeio_agent"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["confluent_kafka.*", "testcontainers.*"]
ignore_missing_imports = true
