[project]
name = "edgeio-api"
version = "0.1.0"
description = "Read-only REST API over the edgeio TimescaleDB"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pydantic-settings>=2.4",
    "python-json-logger>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
