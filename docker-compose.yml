name: edgeio

services:
  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s

  kafka-init:
    image: apache/kafka:3.8.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic device.health --partitions 6 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic device.health.dlq --partitions 1 --replication-factor 1
    restart: "no"

  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    ports:
      - "${TIMESCALE_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: edgeio
      POSTGRES_PASSWORD: edgeio
      POSTGRES_DB: edgeio
    volumes:
      - timescale-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edgeio -d edgeio"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    image: edgeio/worker:dev
    build:
      context: .
      dockerfile: docker/python.Dockerfile
      args:
        PACKAGE: edgeio-worker
    command: ["python", "-m", "edgeio_worker.migrate"]
    environment:
      DATABASE_URL: postgresql://edgeio:edgeio@timescaledb:5432/edgeio
      MIGRATIONS_DIR: /app/db/migrations
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: "no"

  worker:
    image: edgeio/worker:dev
    command: ["python", "-m", "edgeio_worker"]
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      DATABASE_URL: postgresql://edgeio:edgeio@timescaledb:5432/edgeio
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  simulator:
    image: edgeio/simulator:dev
    build:
      context: .
      dockerfile: docker/python.Dockerfile
      args:
        PACKAGE: edgeio-simulator
    command: ["python", "-m", "edgeio_simulator"]
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      SIM_DEVICE_COUNT: "50"
      SIM_INTERVAL_SECONDS: "300"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  api:
    image: edgeio/api:dev
    build:
      context: .
      dockerfile: docker/python.Dockerfile
      args:
        PACKAGE: edgeio-api
    command: ["python", "-m", "edgeio_api"]
    environment:
      DATABASE_URL: postgresql://edgeio:edgeio@timescaledb:5432/edgeio
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  dashboard:
    image: edgeio/dashboard:dev
    build: ./dashboard
    ports:
      - "${DASHBOARD_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  timescale-data:
